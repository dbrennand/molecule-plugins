---
dependency:
  name: galaxy
driver:
  name: azure
platforms:
  - name: instance-1
    groups:
      - foo
      - bar
  - name: instance-2
    groups:
      - foo
      - baz
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_whitelist: profile_roles,profile_tasks,timer
  playbooks:
    create: create.yml
    destroy: destroy.yml
  inventory:
    group_vars:
      all:
        location: "{{ lookup('env', 'AZURE_REGION') or 'westus' }}"
        ssh_user: molecule
        ssh_port: 22
        keypair_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ssh_key"
verifier:
  name: testinfra
