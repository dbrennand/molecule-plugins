---
name: CI

on:
  merge_group:
    branches: ["devel", "main"]
  pull_request:
    branches: ["devel", "main"]
  push:
    branches: ["devel", "main", "releases/**", "stable/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Run prek hooks
        run: uv run --locked --no-default-groups --group lint prek run --all-files
      - name: Check Ruff formatting for the complete Python test tree
        run: uv run --locked --no-default-groups --group lint ruff format --check tests

  unit:
    name: Unit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run unit tests
        run: >-
          uv run --python ${{ matrix.python-version }} --locked
          --no-default-groups --group dev
          pytest tests/units
          --junitxml=junit-unit-${{ matrix.python-version }}.xml
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-unit-${{ matrix.python-version }}
          path: junit-unit-${{ matrix.python-version }}.xml

  templates:
    name: Render and lint driver templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Ansible collections
        run: >-
          uv run --locked --no-default-groups --group dev
          ansible-galaxy collection install -r requirements.yml
      - name: Render and lint all import-resolved templates
        run: >-
          uv run --locked --no-default-groups --group dev
          pytest tests/integration -m template
          --junitxml=junit-template.xml
      - name: Upload template-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-template
          path: junit-template.xml

  local-runtime:
    name: Runtime / ${{ matrix.driver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: docker
            runtime: docker
          - driver: podman
            runtime: podman
          - driver: containers
            runtime: podman
    env:
      MOLECULE_CONTAINERS_BACKEND: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Podman
        if: matrix.runtime == 'podman'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          mirror_file=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_file" ] && grep -Eq '^[[:space:]]*(https?://)?azure\.archive\.ubuntu\.com([/:[:space:]]|$)' "$mirror_file"; then
            mirror_tmp=$(mktemp)
            sudo awk '
              function is_azure(line) {
                return line ~ /^[[:space:]]*(https?:\/\/)?azure\.archive\.ubuntu\.com([\/:[:space:]]|$)/
              }
              function is_canonical(line) {
                return line ~ /^[[:space:]]*(https?:\/\/)?archive\.ubuntu\.com([\/:[:space:]]|$)/
              }
              {
                lines[++line_count] = $0
                if (is_azure($0)) {
                  azure[++azure_count] = $0
                } else if (is_canonical($0)) {
                  canonical[++canonical_count] = $0
                }
              }
              function prefer_canonical(line) {
                sub(/priority:[0-9]+/, "priority:1", line)
                return line
              }
              function demote_azure(line) {
                sub(/priority:[0-9]+/, "priority:9", line)
                return line
              }
              END {
                for (i = 1; i <= canonical_count; i++) print prefer_canonical(canonical[i])
                if (canonical_count == 0) {
                  for (i = 1; i <= azure_count; i++) {
                    line = azure[i]
                    sub(/azure\.archive\.ubuntu\.com/, "archive.ubuntu.com", line)
                    print prefer_canonical(line)
                  }
                }
                for (i = 1; i <= line_count; i++) {
                  if (is_azure(lines[i])) {
                    if (canonical_count == 0) print demote_azure(lines[i])
                    continue
                  }
                  if (canonical_count > 0 && is_canonical(lines[i])) {
                    continue
                  }
                  print lines[i]
                }
                if (canonical_count > 0) {
                  for (i = 1; i <= azure_count; i++) print demote_azure(azure[i])
                }
              }
            ' "$mirror_file" > "$mirror_tmp"
            sudo mv "$mirror_tmp" "$mirror_file"
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            install --yes podman
          podman info
      - name: Check Docker
        if: matrix.runtime == 'docker'
        run: docker info
      - name: Install Ansible collections
        run: >-
          uv run --locked --all-extras --no-default-groups --group dev
          ansible-galaxy collection install -r requirements.yml
      - name: Run selected runtime integration
        run: >-
          uv run --locked --all-extras --no-default-groups --group dev
          pytest tests/integration/${{ matrix.driver }}
          -m runtime --require-integration
          --junitxml=junit-${{ matrix.driver }}.xml
      - name: Upload runtime-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-${{ matrix.driver }}
          path: junit-${{ matrix.driver }}.xml

  vagrant:
    name: Runtime / Vagrant and libvirt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Vagrant and libvirt
        run: |
          sudo apt-get update
          sudo apt-get install --yes acl curl gpg libguestfs-tools libvirt-clients libvirt-daemon-system libvirt-dev qemu-kvm ruby-dev
          curl --fail --silent --show-error https://apt.releases.hashicorp.com/gpg \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install --yes vagrant
          sudo systemctl start libvirtd
          if [ -e /dev/kvm ]; then sudo setfacl -m "u:$USER:rw" /dev/kvm; fi
          sudo setfacl -m "u:$USER:rw" /var/run/libvirt/libvirt-sock
          vagrant plugin install vagrant-libvirt
          virsh --connect qemu:///system list
          vagrant plugin list
      - name: Install Ansible collections
        run: >-
          uv run --locked --all-extras --no-default-groups --group dev
          ansible-galaxy collection install -r requirements.yml
      - name: Run Vagrant integration
        run: >-
          uv run --locked --all-extras --no-default-groups --group dev
          pytest tests/integration/vagrant
          -m runtime --require-integration
          --junitxml=junit-vagrant.xml
      - name: Upload Vagrant-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-vagrant
          path: junit-vagrant.xml

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build distributions
        run: >-
          uv run --locked --no-default-groups --group pkg
          python -m build --outdir dist
      - name: Validate distributions
        run: >-
          uv run --locked --no-default-groups --group pkg
          python -m twine check --strict dist/*
      - name: Verify packaged Cookiecutter resources
        run: |
          uv run --locked --no-default-groups --group pkg python -c '
          import glob, sys, zipfile
          sys.path.insert(0, ".")
          from tests.integration.templates import EXPECTED_TEMPLATE_FILES
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = []
          for driver, files in EXPECTED_TEMPLATE_FILES.items():
              prefix = "molecule_plugins/" + driver + "/cookiecutter/"
              for name in files:
                  if not any(n.startswith(prefix) and n.endswith("/" + name) for n in names):
                      missing.append((driver, name))
          assert not missing, missing
          print(f"packaged_templates_verified={len(EXPECTED_TEMPLATE_FILES)}")
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  molecule-main:
    name: Compatibility / Molecule main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
      - name: Create isolated compatibility environment
        run: |
          uv venv --python 3.13 .venv-devel
          uv pip install --python .venv-devel/bin/python \
            --editable ".[azure,docker,ec2,gce,openstack,podman,vagrant]" \
            pytest pytest-testinfra jsonschema \
            "molecule @ git+https://github.com/ansible-community/molecule.git@main"
      - name: Run unit tests against Molecule main
        run: .venv-devel/bin/pytest tests/units
