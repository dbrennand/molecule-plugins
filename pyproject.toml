[build-system]
requires = [
  "setuptools >= 77.0.0", # required by pyproject+setuptools_scm integration
  "setuptools_scm[toml] >= 7.0.5" # required for "no-local-version" scheme
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "ansible-lint>=26.8.0",
  "boto3>=1.34.0",
  "cookiecutter>=2.6.0",
  "jsonschema>=4.23.0",
  "molecule>=26.8.0",
  "pytest>=8.4.2",
  "pytest-testinfra>=10.2.2"
]
docker = [
  "docker>=4.3.1",
  "requests>=2.32.5",
  "selinux>=0.3.0 ; sys_platform == 'linux'",
  "selinux>=0.3.0 ; sys_platform == 'linux2'"
]
lint = [
  "prek>=0.4.13",
  "ruff==0.12.12"
]
pkg = [
  "build>=0.9",
  "twine>=4.0.1"
]
provider = [
  # GCE controller SDKs used by gcp_compute_* modules and windows_auth.py.
  # Azure SDKs are installed from the azcollection requirements file in the
  # provider workflow because that collection pins a dedicated SDK set.
  "google-api-python-client>=2.130.0",
  "google-cloud-storage>=2.16.0",
  "oauth2client>=4.1.3",
  "pycryptodome>=3.20.0"
]

[project]
# https://peps.python.org/pep-0621/#readme
requires-python = ">=3.10"
dynamic = ["version"]
name = "molecule-plugins"
description = "Molecule Plugins"
readme = "README.md"
authors = [{"name" = "Sorin Sbarnea", "email" = "sorin.sbarnea@gmail.com"}]
maintainers = [{"name" = "Sorin Sbarnea", "email" = "sorin.sbarnea@gmail.com"}]
license = "MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities"
]
keywords = ["ansible", "testing", "molecule", "plugin"]
dependencies = [
  # molecule plugins are not allowed to mention Ansible as a direct dependency
  "molecule>=26.8.0"
]

[project.entry-points."molecule.driver"]
azure = "molecule_plugins.azure.driver:Azure"
containers = "molecule_plugins.containers.driver:Container"
docker = "molecule_plugins.docker.driver:Docker"
ec2 = "molecule_plugins.ec2.driver:EC2"
gce = "molecule_plugins.gce.driver:GCE"
podman = "molecule_plugins.podman.driver:Podman"
vagrant = "molecule_plugins.vagrant.driver:Vagrant"
openstack = "molecule_plugins.openstack.driver:Openstack"

[project.optional-dependencies]
azure = []
docker = [
  # selinux python module is needed as least by ansible-docker modules
  # and allows use of isolated (default) virtualenvs. It does not avoid need
  # to install the system selinux libraries but it will provide a clear
  # message when user has to do that.
  'selinux; sys_platform=="linux2"',
  'selinux; sys_platform=="linux"',
  "docker >= 4.3.1",
  "requests" # also required by docker
]
ec2 = []
gce = [
  "requests >= 2.31.0",
  "google-auth >= 2.28.2"
]
podman = [
]
selinux = [
  # selinux python module is needed as least by podman and docker on systems
  # that do have selinux enabled and where code is running inside of an
  # isolated (default) virtualenv. It does not avoid need to install the
  # system selinux libraries but it will provide a clear message when user
  # has to do that.
  'selinux; sys_platform=="linux2"',
  'selinux; sys_platform=="linux"'
]
vagrant = [
  "python-vagrant"
]
openstack = [
  "openstacksdk >= 1.1.0"
]

[project.urls]
homepage = "https://github.com/ansible-community/molecule-plugins"
documentation = "https://molecule.readthedocs.io/"
repository = "https://github.com/ansible-community/molecule-plugins"
changelog = "https://github.com/ansible-community/molecule-plugins/releases"

[tool.codespell]
skip = "uv.lock"

[tool.pytest.ini_options]
addopts = [
  "--durations=10",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
  "-v"
]
junit_suite_name = "molecule_test_suite"
markers = [
  "azure: Azure driver integration",
  "containers: Containers driver integration",
  "docker: Docker driver integration",
  "ec2: EC2 driver integration",
  "gce: GCE driver integration",
  "integration: invokes an external integration boundary",
  "openstack: OpenStack driver integration",
  "podman: Podman driver integration",
  "provider: requires external cloud provider infrastructure",
  "runtime: requires a local container or virtualization runtime",
  "template: renders and lints a packaged driver template",
  "vagrant: Vagrant driver integration"
]
norecursedirs = ["molecule"]
python_files = ["*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
lint.ignore = [
  # Long comments, synchronization text, and Jinja/Vagrant strings remain after formatting.
  "E501",
  # Exception-message refactoring is a separate localized increment.
  "EM102",
  # Broad annotation changes require meaningful API and test review.
  "ANN",
  # Unused framework callback and driver arguments need context-specific review.
  "ARG",
  # The mutable default in the Docker filter needs a focused behavior check.
  "B006",
  # Add an explicit warning stacklevel in a later small increment.
  "B028",
  # Broad exception handling needs backend-failure analysis.
  "BLE",
  # The Docker filter refactor overlaps with B006 and needs separate review.
  "C901",
  # Formatter ownership makes this a low-value duplicate policy.
  "COM812",
  # The docstring migration is a separate project-wide change.
  "D",
  # Timezone semantics require a separate domain decision.
  "DTZ",
  # This pytest/helper boolean API may affect callers if made keyword-only.
  "FBT",
  # Adding package markers could alter Molecule, Ansible, or test imports.
  "INP",
  # Explicit string concatenation cleanup is a separate low-risk increment.
  "ISC",
  # External/API names, fixtures, and the test layout need to retain their conventions.
  "N",
  # Exception handling inside polling loops is likely intentional.
  "PERF203",
  # Generic noqa cleanup requires review of the underlying import findings.
  "PGH",
  # Magic values in Windows-auth and Molecule tests need domain review.
  "PLR",
  # Path migration risks changing str/Path boundaries in Molecule APIs.
  "PTH",
  # These return/control-flow findings require focused semantic review.
  "RET",
  # Assertions, temporary paths, non-cryptographic randomness, and executable names are intentional here.
  "S",
  # Exception-style migration needs focused review and overlaps with EM102.
  "TRY"
]
lint.select = ["ALL"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/molecule_plugins/_version.py"

[tool.uv]
default-groups = ["dev"]
package = true
